<!doctype html>
<html lang="ru" class="tg-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060709" />
    <title>Клуб ИИшница</title>
    <meta name="description" content="Клуб про путь из стройки в ИИ." />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #060709; color: #E8DFC8; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      #boot { padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 18px; }
      #boot .title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.025em; color: #E5B247; }
      #boot .hint { font-size: 11px; color: #7D7A6F; text-align: center; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; }
      #boot .ring-wrap { position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center; }
      #boot .spinner { position: absolute; inset: 0; width: 104px; height: 104px; border: 1.5px solid rgba(229,178,71,0.14); border-top-color: #E5B247; border-radius: 50%; animation: spin 1.2s linear infinite; }
      #boot .egg { width: 76px; height: 76px; filter: drop-shadow(0 6px 18px rgba(229,178,71,0.4)); animation: eggPulse 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes eggPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="ring-wrap">
          <div class="spinner"></div>
          <svg class="egg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <radialGradient id="white" cx="0.5" cy="0.5" r="0.55">
                <stop offset="0" stop-color="#FFFBEC"/>
                <stop offset="0.7" stop-color="#F6EBCA"/>
                <stop offset="0.92" stop-color="#E4CE93"/>
                <stop offset="1" stop-color="#A87C2E"/>
              </radialGradient>
              <radialGradient id="yolk" cx="0.42" cy="0.4" r="0.6">
                <stop offset="0" stop-color="#FFE89A"/>
                <stop offset="0.3" stop-color="#FFC448"/>
                <stop offset="0.75" stop-color="#E89B14"/>
                <stop offset="1" stop-color="#8C5A07"/>
              </radialGradient>
              <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
                <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Irregular fried-egg-white silhouette — hand-drawn rough edge, no SVG filter (iOS WebView stable) -->
            <path
              d="M60 6
                 C 70 5, 80 8, 88 14
                 C 96 16, 103 24, 105 32
                 C 112 38, 113 47, 108 54
                 C 115 60, 114 72, 106 80
                 C 104 90, 94 99, 84 102
                 C 76 109, 64 110, 54 107
                 C 44 110, 32 106, 26 98
                 C 16 96, 8 86, 8 76
                 C 2 70, 3 58, 10 52
                 C 4 44, 8 32, 18 26
                 C 20 18, 30 12, 40 11
                 C 48 6, 54 6, 60 6 Z"
              fill="url(#white)"
              stroke="#8B5E16" stroke-width="0.9" stroke-linejoin="round"/>

            <!-- Subtle white-folds texture -->
            <ellipse cx="35" cy="40" rx="10" ry="4" fill="#FFFFFF" opacity="0.35" transform="rotate(-18 35 40)"/>
            <ellipse cx="85" cy="75" rx="9" ry="3" fill="#FFFFFF" opacity="0.25" transform="rotate(20 85 75)"/>
            <ellipse cx="30" cy="78" rx="7" ry="2.5" fill="#FFFFFF" opacity="0.3" transform="rotate(-10 30 78)"/>
            <ellipse cx="90" cy="32" rx="6" ry="2" fill="#FFFFFF" opacity="0.28" transform="rotate(25 90 32)"/>

            <!-- Pepper specks scattered around white -->
            <g fill="#3a2410" opacity="0.7">
              <circle cx="78" cy="34" r="0.7"/>
              <circle cx="35" cy="55" r="0.6"/>
              <circle cx="86" cy="62" r="0.8"/>
              <circle cx="42" cy="80" r="0.6"/>
              <circle cx="70" cy="88" r="0.7"/>
              <circle cx="25" cy="48" r="0.5"/>
              <circle cx="92" cy="48" r="0.6"/>
            </g>

            <!-- Yolk -->
            <ellipse cx="58" cy="58" rx="22" ry="21" fill="url(#yolk)"/>
            <!-- Pepper on yolk -->
            <g fill="#2a1804" opacity="0.8">
              <circle cx="50" cy="48" r="0.8"/>
              <circle cx="68" cy="52" r="0.7"/>
              <circle cx="65" cy="68" r="0.6"/>
              <circle cx="55" cy="72" r="0.7"/>
              <circle cx="48" cy="62" r="0.6"/>
            </g>
            <!-- Shine highlight on yolk -->
            <ellipse cx="50" cy="50" rx="7" ry="4" fill="url(#shine)"/>
          </svg>
        </div>
        <div class="title">ИИшница</div>
        <div class="hint">клуб</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
